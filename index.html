const ITABS=[['overview','Overview'],['submission','Submission'],['ai','AI report'],['reviews','Reviews'],['decision','Decision'],['pitch','Pitch and sponsors'],['history','History']];
R['admin-idea']=r=>{const i=idea(S.ui.aid);if(!i)return aShell(r,emptyBox('No idea selected','Open one from Submissions.'));const t=S.ui.itab||'overview';let b='';
if(t==='overview'){const c=S.creators.find(x=>x.id===i.creator);b=`<dl class="kv"><dt>Reference</dt><dd>${i.id}</dd><dt>Title</dt><dd>${esc(i.removed?'(content removed)':i.title)}</dd><dt>Sector and stage</dt><dd>${esc(i.sector)} · ${esc(i.stage)}</dd><dt>Step</dt><dd>${pill(i.step,'b')}</dd><dt>Outcome</dt><dd>${outPill(i.outcome)} ${esc(i.reason)}</dd><dt>Submitted</dt><dd>${fd(i.submitted)} · 7-day limit ${fd(expected(i))} ${daysPill(i)}</dd><dt>Creator</dt><dd>${esc(c.name)} · ${esc(c.email)} · ${esc(c.phone)} <span class="small mute">(access logged)</span></dd></dl>
<h3 style="margin-top:1.2rem">Assign panelists</h3><form class="row" data-form="assign" style="align-items:center">${S.panelists.filter(p=>p.active&&!i.conflicts.includes(p.id)).map(p=>`<label class="chk"><input type="checkbox" name="p" value="${p.id}" ${i.assigned.includes(p.id)?'checked':''}> ${esc(p.name)}</label>`).join('')}<button class="btn sm">Save assignment</button></form>${i.conflicts.length?`<p class="small" style="margin-top:.6rem">${pill('Conflict declared','w')} ${i.conflicts.length} panelist(s) removed. Reassign above.</p>`:''}<p style="margin-top:1rem"><button class="btn ghost sm" data-act="returnidea" data-id="${i.id}">Return incomplete submission to creator</button></p>`}
if(t==='submission')b=i.removed?`<div class="note">Content removed from the platform. Decision record kept.</div>`:`<dl class="kv">${ideaRows(i)}</dl>`;
if(t==='ai')b=aiTab(i);
if(t==='reviews')b=i.reviews.length?i.reviews.map(v=>`<div class="card" style="margin-bottom:.8rem"><div class="row" style="justify-content:space-between"><b>${esc(S.panelists.find(p=>p.id===v.p).name)}</b><span>${pill('Total '+v.total.toFixed(1)+' / 5','b')} ${pill(v.cat)} ${v.reason?pill(v.reason):''}</span></div><div class="small mute" style="margin:.5rem 0">${CRIT.map((c,k)=>c[0]+': '+v.scores[k]).join(' · ')}</div><dl class="kv"><dt>Strengths</dt><dd>${esc(v.fb.s)}</dd><dt>Improvements</dt><dd>${esc(v.fb.i)}</dd><dt>Next step</dt><dd>${esc(v.fb.n)}</dd></dl></div>`).join(''):emptyBox('No reviews yet','Assign panelists on the Overview tab.');
if(t==='decision')b=decisionTab(i);
if(t==='pitch')b=pitchTab(i);
if(t==='history')b=`<ul class="tl">${i.history.slice().reverse().map(h=>`<li><b>${fd(h.t,{day:'numeric',month:'short'})}</b>${esc(h.txt)}</li>`).join('')}</ul>`;
return aShell(r,`<p><a href="#admin-submissions">← Submissions</a></p><h1>${i.id}: ${esc(i.removed?'(content removed)':i.title)}</h1>${tabsHtml(ITABS,t,'itab')}${b}`)};
FORMS.assign=(f,v)=>{const i=idea(S.ui.aid);i.assigned=arr(v.p);if(i.step==='Submitted'&&i.assigned.length)i.step='In review';hist(i,'Assigned to '+i.assigned.length+' panelist(s)');log('Assigned panelists',i.id);save();toast('Assignment saved');render()};
ACTS.returnidea=id=>{const i=idea(id);i.step='Draft';S.messages.push({id:nid('MS-',S.messages),creator:i.creator,from:'Foundry team',txt:'Your submission '+id+' needs a correction before review. Please check your idea and resubmit.',at:'2027-03-09'});hist(i,'Returned to creator for correction');log('Returned to creator',id);save();toast('Returned to creator');render()};
function aiRun(i){const t=(i.problem+' '+i.users+' '+i.idea+' '+i.evidence).toLowerCase(),fl=[];const hw=/(sensor|device|hardware|battery|drone|machine)/.test(t),reg=/(drug|loan|lending|bank|medical|clinical|insurance|crypto)/.test(t),ill=/(illegal|counterfeit|fake drug|launder)/.test(t),ev=i.evidence.length;
const gaps=[];if(i.problem.length<60)gaps.push('Problem is short');if(i.users.length<30)gaps.push('Users are vague');if(ev<40)gaps.push('Little evidence');
const sug=ill?'Declined (needs human check)':hw?'Specialist pool':reg?'Specialist pool (regulated, check)':'Good idea pool or above';
return{at:'9 Mar 2027',gaps,hw,reg,ill,ev:ev>=80?'Moderate':ev>=40?'Light':'Weak',overlap:S.ideas.filter(x=>x.id!==i.id&&!x.removed&&x.sector===i.sector&&x.title!=='').map(x=>x.id),sum:i.idea.slice(0,140),q:['Who pays, and how much?','What is the smallest first version?'],sug,conf:ill?'Low (flag for a person)':'Medium'}}
function aiTab(i){if(!S.settings.aiOn)return `<div class="note">AI vetting is switched off in Settings. Review continues manually.</div>`;if(i.removed)return '<p class="mute">No report: content removed.</p>';const a=i.ai;
return `<div class="info" style="margin-bottom:1rem">Assistant report: a completeness check using simple keyword and length rules. It only advises. People decide.</div><p><button class="btn sm" data-act="runai" data-id="${i.id}">${a?'Run again':'Run assistant'}</button> <span class="small mute">Sends only the idea text with its reference number. No names, emails or phone numbers.</span></p>${a?`<dl class="kv"><dt>Run</dt><dd>${a.at} · ${i.id}</dd><dt>Completeness</dt><dd>${a.gaps.length?esc(a.gaps.join('; ')):'No gaps found'}</dd><dt>Safety and legal flags</dt><dd>${a.ill?pill('Possible illegal content: send to a person','r'):'None found'} ${a.reg?pill('Possibly regulated','w'):''}</dd><dt>Type and complexity</dt><dd>${a.hw?'Possible hardware':'Software only'}</dd><dt>Evidence strength</dt><dd>${a.ev}</dd><dt>Possible overlap</dt><dd>${a.overlap.length?a.overlap.join(', ')+' (same sector)':'None'}</dd><dt>Summary</dt><dd>${esc(a.sum)}…</dd><dt>Questions to ask</dt><dd>${a.q.map(esc).join(' · ')}</dd><dt>Suggested category</dt><dd>${esc(a.sug)} · confidence ${esc(a.conf)}</dd></dl><p class="small mute">An uncertain or safety flag goes to a person. It never declines an idea automatically.</p>`:''}`}
ACTS.runai=id=>{const i=idea(id);i.ai=aiRun(i);log('AI report run',id);save();render()};
function decisionTab(i){const rs=i.reviews[0],fb=i.fb||{s:rs?rs.fb.s:'',i:rs?rs.fb.i:'',n:rs?rs.fb.n:''},sel=i.draftOut||i.outcome;const rlist=sel==='Declined'?DECL:sel==='Specialist pool'?SPEC:[];
let ap='';if(i.appeal){const same=i.decidedBy===adm().id;ap=`<div class="card" style="margin-bottom:1rem;border-color:#F1DDA5"><h3>Review requested by creator</h3><p class="small">Status: ${esc(i.appeal.status)}${i.appeal.result?' · '+esc(i.appeal.result):''}. Original decision by ${esc((S.users.find(u=>u.id===i.decidedBy)||{name:'unknown'}).name)}.</p>${i.appeal.status==='Requested'?(same?`<div class="note">A different admin must decide this review. Sign in as the other admin.</div>`:`<form class="row" data-form="appealdec"><select name="res" style="width:auto"><option>Decision upheld</option><option>Decision changed: Good idea pool</option><option>Decision changed: Specialist pool</option></select><button class="btn sm">Record decision</button></form>`):''}</div>`}
return `${ap}${i.removed?'<div class="note">Content removed. The decision record is kept.</div>':''}<form class="form" data-form="decide" style="max-width:44rem"><div class="fg">${field('out','Outcome',`<select id="out" name="out" data-chg="outchg"><option value="">Choose</option>${opts(['Declined','Specialist pool','Good idea pool','Top 3'],sel)}</select>`)}${field('reason','Reason',`<select id="reason" name="reason"><option value="">${rlist.length?'Choose':'Not needed'}</option>${opts(rlist,i.reason)}</select>`)}</div>${field('fs','Strengths',`<textarea id="fs" name="fs">${esc(fb.s)}</textarea>`)}${field('fi','Improvements',`<textarea id="fi" name="fi">${esc(fb.i)}</textarea>`)}${field('fn','Next step',`<textarea id="fn" name="fn">${esc(fb.n)}</textarea>`)}${i.fbEdited?`<p class="small">${pill('Edited from panelist words','w')} The edit is recorded.</p>`:''}${i.held?`<div class="note">Held for quality check by ${esc(i.held)}.</div>`:''}${i.released?`<div class="ok">Released.${i.outcome==='Declined'?' Declined content is locked for a 14-day review window (Option A), then removed. Pending owner decision.':''}</div>`:`<div class="row"><button class="btn ghost" name="do" value="save">Save draft</button><button class="btn ghost" name="do" value="hold" type="submit">${i.held?'Remove hold':'Hold for quality check'}</button><button class="btn" name="do" value="release">Release feedback</button></div>`}</form>`}
ACTS.outchg=(id,el)=>{const i=idea(S.ui.aid);i.draftOut=el.value;i.reason='';const f=el.closest('form');i.fbEdited=i.fbEdited;const v={fs:$('#fs').value,fi:$('#fi').value,fn:$('#fn').value};i.fb=Object.assign({},i.fb||{},{s:v.fs,i:v.fi,n:v.fn});save();render()};
FORMS.decide=(f,v)=>{const i=idea(S.ui.aid);const sub=document.activeElement&&document.activeElement.value;const act=(f._act)||sub;const btn=f.querySelector('button[type=submit]:focus')||null;
const mode=f._mode||'save';doDecide(i,v,mode)};
document.addEventListener('click',e=>{const b=e.target.closest('form[data-form=decide] button[name=do]');if(b)b.form._mode=b.value});
function doDecide(i,v,mode){const rs=i.reviews[0];const edited=rs&&(v.fs!==rs.fb.s||v.fi!==rs.fb.i||v.fn!==rs.fb.n);i.fb={s:v.fs,i:v.fi,n:v.fn};i.fbEdited=!!edited;if(edited)hist(i,'Feedback edited by admin (marked)');
if(v.out){if(i.outcome!==v.out&&i.outcome!=='Pending')hist(i,'Outcome changed from '+i.outcome+' to '+v.out);i.outcome=v.out;i.draftOut=v.out}i.reason=v.reason||'';
if(mode==='hold'){i.held=i.held?'':adm().name;hist(i,i.held?'Held for quality check':'Hold removed');log('Hold toggled',i.id);save();toast(i.held?'Held':'Hold removed');render();return}
if(mode==='release'){if(!i.outcome||i.outcome==='Pending'){toast('Choose an outcome first');return}if((i.outcome==='Declined'||i.outcome==='Specialist pool')&&!i.reason){toast('Choose a reason');return}if(i.held){toast('Remove the hold first');return}
i.released=true;i.step=i.outcome==='Top 3'?'Decision recorded':'Feedback issued';i.decidedBy=adm().id;if(i.outcome==='Top 3'&&!i.mvp)i.mvp={agreement:'Pending',scope:'',budget:'',milestones:[['Discovery complete',false],['Prototype validated',false],['First version live',false]],preview:'',tests:'0 of 15 test users recruited',validation:'Not started',build:'Not yet scoped'};
hist(i,'Outcome set: '+i.outcome+(i.reason?' ('+i.reason+')':'')+'. Feedback released.');S.messages.push({id:nid('MS-',S.messages),creator:i.creator,from:'Foundry team',txt:'Your feedback for '+i.id+' is ready: '+i.outcome+'. You can now submit another idea.',at:'2027-03-09'});log('Feedback released: '+i.outcome,i.id);save();toast('Feedback released to the creator');render();return}
log('Decision draft saved',i.id);save();toast('Draft saved');render()}
FORMS.appealdec=(f,v)=>{const i=idea(S.ui.aid);i.appeal.status='Decided';i.appeal.result=v.res;i.appeal.by=adm().id;if(v.res.includes('Good'))i.outcome='Good idea pool';if(v.res.includes('Specialist'))i.outcome='Specialist pool';if(v.res.includes('changed')){i.reason=''}hist(i,'Review decided by '+adm().name+': '+v.res);log('Review decided',i.id);save();toast('Review recorded');render()};
function pitchTab(i){const ints=S.interests.filter(x=>x.idea===i.id);return `<div class="grid g2" style="align-items:start"><div class="card"><h3>Pitch</h3>${i.pitch&&i.pitch.invited?`<p>${pill('Invited','g')} ${i.pitch.answer?pill(i.pitch.answer,i.pitch.answer==='Accepted'?'g':'r'):pill('Awaiting answer','w')}</p>`:`<form class="row" data-form="invite">${i.released&&['Good idea pool','Top 3','Specialist pool'].includes(i.outcome)?`<select name="ev" style="width:auto">${S.events.map(e=>`<option value="${e.id}">${esc(e.title)}</option>`).join('')}</select><button class="btn sm">Invite to pitch</button>`:'<span class="small mute">Available after feedback is released for a qualified idea.</span>'}</form>`}</div>
<div class="card"><h3>Sponsor card</h3>${i.removed||i.outcome==='Declined'?'<p class="mute">Declined ideas never appear to sponsors.</p>':`<p><b>${esc(i.card.title||'(no card text)')}</b><br><span class="mute">${esc(i.card.summary)}</span></p><p>${i.card.approved?pill('Approved by creator','g'):pill('Not approved by creator','w')} ${i.card.published?pill('Published to sponsors','g'):pill('Not published')}</p>${i.card.published?`<button class="btn ghost sm" data-act="unpub" data-id="${i.id}">Unpublish</button>`:`<button class="btn sm" data-act="pub" data-id="${i.id}" ${i.card.approved&&i.released?'':'disabled'}>Publish card</button>`}`}</div></div><h3 style="margin-top:1.2rem">Sponsor interest on this idea</h3>${ints.length?ints.map(x=>`<div class="sc"><span><b>${esc(orgOf(x.org).name)}</b> (${GROUPS[orgOf(x.org).group]}) · ${esc(x.type)}</span>${pill(x.stage,'b')}</div>`).join(''):'<p class="mute">None.</p>'}`}
FORMS.invite=(f,v)=>{const i=idea(S.ui.aid);i.pitch={invited:true,event:v.ev,answer:''};i.step='Pitch invited';hist(i,'Invited to pitch');S.messages.push({id:nid('MS-',S.messages),creator:i.creator,from:'Foundry team',txt:'You are invited to pitch. See the meeting card on your dashboard.',at:'2027-03-09'});log('Pitch invited',i.id);save();toast('Invitation sent');render()};
ACTS.pub=id=>{const i=idea(id);if(!i.card.approved||!i.released){toast('Creator approval needed');return}i.card.published=true;hist(i,'Card published to sponsors');log('Card published',id);save();toast('Published');render()};
ACTS.unpub=id=>{const i=idea(id);i.card.published=false;hist(i,'Card unpublished');log('Card unpublished',id);save();render()};
R['admin-panels']=r=>aShell(r,`<h1>Panels</h1><div class="tw"><table class="tbl"><thead><tr><th>Panelist</th><th>Assigned</th><th>Completed</th><th>Status</th></tr></thead><tbody>${S.panelists.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="small mute">${esc(p.email)}</span></td><td>${S.ideas.filter(i=>i.assigned.includes(p.id)).length}</td><td>${doneFor(p)}</td><td>${p.active?pill('Active','g'):pill('Access removed','r')}</td></tr>`).join('')}</tbody></table></div><h3 style="margin-top:1.5rem">Ideas needing reassignment</h3>${S.ideas.filter(i=>i.conflicts.length&&!i.released).map(i=>`<div class="sc"><span><b>${i.id}</b> · conflict declared</span><button class="btn sm" data-act="openidea" data-id="${i.id}">Open</button></div>`).join('')||'<p class="mute">None.</p>'}<h3 style="margin-top:1.5rem">Invite a panelist</h3><form class="form" data-form="invpanel" style="max-width:30rem"><div class="fg">${field('name','Name',inp('name','text','',1))}${field('email','Email',inp('email','email','',1))}</div><div><button class="btn">Send invitation</button></div></form>`);
FORMS.invpanel=(f,v)=>{const id='p'+(S.panelists.length+1);S.panelists.push({id,name:v.name,email:v.email,active:true});S.users.push({id:'u'+(S.users.length+1),name:v.name,email:v.email,role:'Panelist',state:'Invited'});log('Panelist invited',v.email);save();toast('Single-use invitation link created (not emailed in this prototype)');render()};
R['admin-decisions']=r=>{const l=S.ideas.filter(i=>i.reviews.length&&!i.released);return aShell(r,`<h1>Decisions</h1><p class="mute">Ideas with completed reviews, waiting for a decision and feedback release.</p>${l.length?`<div class="tw"><table class="tbl"><thead><tr><th>Ref</th><th>Reviews</th><th>Average</th><th>Panel suggests</th><th>Limit</th><th></th></tr></thead><tbody>${l.map(i=>`<tr><td><b>${i.id}</b></td><td>${i.reviews.length} of ${i.assigned.length}</td><td>${(i.reviews.reduce((a,x)=>a+x.total,0)/i.reviews.length).toFixed(1)}</td><td>${[...new Set(i.reviews.map(x=>x.cat))].join(', ')}</td><td>${daysPill(i)}</td><td><button class="btn sm" data-act="opendecision" data-id="${i.id}">Decide</button></td></tr>`).join('')}</tbody></table></div>`:emptyBox('Nothing waiting','Ideas appear here after panelists submit reviews.')}`)};
ACTS.opendecision=id=>{S.ui.aid=id;S.ui.itab='decision';save();go('admin-idea')};
R['admin-reviews']=r=>{const l=S.ideas.filter(i=>i.appeal);return aShell(r,`<h1>Reviews and complaints</h1><p class="mute">Requests for a review of a Declined or Specialist decision. A different admin from the original decision-maker decides.</p>${l.length?`<div class="tw"><table class="tbl"><thead><tr><th>Ref</th><th>Outcome</th><th>Status</th><th>Decided by</th><th></th></tr></thead><tbody>${l.map(i=>`<tr><td><b>${i.id}</b></td><td>${outPill(i.outcome)}</td><td>${pill(i.appeal.status,i.appeal.status==='Decided'?'g':'w')} ${esc(i.appeal.result)}</td><td>${esc((S.users.find(u=>u.id===i.decidedBy)||{name:'-'}).name)}</td><td><button class="btn sm" data-act="opendecision" data-id="${i.id}">Open</button></td></tr>`).join('')}</tbody></table></div>`:emptyBox('No review requests','Creators can ask for a review from their feedback page.')}`)};
R['admin-events']=r=>aShell(r,`<h1>Events</h1><div class="tw"><table class="tbl"><thead><tr><th>Event</th><th>Date</th><th>Format</th><th>Venue or link</th><th>Status</th></tr></thead><tbody>${S.events.map(e=>`<tr><td><b>${esc(e.title)}</b></td><td>${fd(e.date)}</td><td>${esc(e.format)}</td><td>${esc(e.where)}</td><td>${pill(e.status,'t')}</td></tr>`).join('')}</tbody></table></div><p class="small mute" style="margin-top:.6rem">Reminders go out one week, one day and one hour before, where time allows. Invited creators: ${S.ideas.filter(i=>i.pitch&&i.pitch.invited).length}.</p><h3 style="margin-top:1.5rem">Add an event</h3><form class="form" data-form="event" style="max-width:36rem">${field('title','Title',inp('title','text','Pitch Night',1))}<div class="fg">${field('date','Date',inp('date','date','2027-04-17',1))}${field('format','Format',`<select id="format" name="format">${opts(['On site','Online'])}</select>`)}</div>${field('where','Venue or meeting link',inp('where','text','',1))}<div><button class="btn">Add event</button></div></form><h3 style="margin-top:1.5rem">Sponsor sessions</h3>${S.interests.filter(x=>['Scheduled','Held'].includes(x.stage)).map(x=>`<div class="sc"><span>${esc(orgOf(x.org).name)} · ${x.idea} ${x.when?'· '+esc(x.when):''}</span>${pill(x.stage,'b')}</div>`).join('')||'<p class="mute">None scheduled.</p>'}`);
FORMS.event=(f,v)=>{S.events.push({id:nid('EV-',S.events),title:v.title,date:v.date,format:v.format,where:v.where,status:'Planned'});log('Event added',v.title);save();toast('Event added');render()};
R['admin-community']=r=>{const t=S.ui.ctype||'';const l=S.community.filter(x=>!t||x.type===t);return aShell(r,`<h1>Community</h1><div class="row" style="margin:1rem 0"><select data-chg="ctype" aria-label="Type" style="width:auto"><option value="">All types</option>${opts(['Creator or aspiring creator','Student','Professional or expert','Business owner','Investor','Other'],t)}</select><button class="btn ghost sm" data-act="copycsv" data-id="community">Copy as CSV</button></div><div class="tw"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>Type</th><th>Joined</th></tr></thead><tbody>${l.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.type)}</td><td>${fd(x.at,{day:'numeric',month:'short'})}</td></tr>`).join('')}</tbody></table></div><h3 style="margin-top:1.5rem">Send a message to ${t?'this group':'everyone'} (${l.length})</h3><form class="form" data-form="bulk" style="max-width:36rem">${field('subj','Subject',inp('subj','text','',1))}${field('body','Message',`<textarea id="body" name="body" required></textarea>`)}<div><button class="btn">Queue message</button></div></form>`)};
ACTS.ctype=(id,el)=>{S.ui.ctype=el.value;save();render()};
FORMS.bulk=(f,v)=>{log('Community message queued',v.subj);save();toast('Message queued. Sending uses your email tool in the real app.')};
ACTS.copycsv=k=>{let t='';if(k==='community')t=csv([['id','name','email','type','city','joined']].concat(S.community.map(x=>[x.id,x.name,x.email,x.type,x.city,x.at])));else t=csv([['id','organisation','type','city','registered','reach','contact','email','phone','help','status']].concat(S.partners.map(x=>[x.id,x.org,x.type,x.city,x.reg,x.reach,x.name,x.email,x.phone,x.help.join('; '),x.status])));log('Exported '+k,'');save();try{navigator.clipboard.writeText(t).then(()=>toast('CSV copied'),()=>toast('Copy blocked in this view'))}catch(e){toast('Copy blocked in this view')}};
R['admin-cpartners']=r=>{const t=S.ui.pt||'';const l=S.partners.filter(x=>!t||x.status===t);return aShell(r,`<h1>Community Partners</h1><div class="row" style="margin:1rem 0"><select data-chg="pfil" aria-label="Status" style="width:auto"><option value="">All statuses</option>${opts(['New','Contacted','Active partner','Not now'],t)}</select><button class="btn ghost sm" data-act="copycsv" data-id="partners">Copy as CSV</button><a class="btn ghost sm" href="#partner-form">Open the public form</a></div>${l.map(x=>`<div class="card" style="margin-bottom:.8rem"><div class="row" style="justify-content:space-between;align-items:center"><div><b>${esc(x.org)}</b> <span class="small mute">${x.id} · ${esc(x.type)} · ${esc(x.city)}</span></div><select data-chg="pstat" data-id="${x.id}" aria-label="Status" style="width:auto">${opts(['New','Contacted','Active partner','Not now'],x.status)}</select></div><dl class="kv" style="margin-top:.6rem"><dt>Contact</dt><dd>${esc(x.name)}, ${esc(x.role)} · ${esc(x.email)} · ${esc(x.phone)}</dd><dt>Reach</dt><dd>${esc(x.reach)} · ${esc(x.who)} · ${esc(x.reg)}${x.regno?' ('+esc(x.regno)+')':''}</dd><dt>Can help with</dt><dd>${esc(x.help.join(', '))}</dd><dt>Areas</dt><dd>${esc(x.areas.join(', ')||'-')}</dd>${x.note?`<dt>Note</dt><dd>${esc(x.note)}</dd>`:''}</dl><div class="field" style="margin-top:.5rem"><label for="n${x.id}" class="small mute">Admin notes</label><input id="n${x.id}" type="text" value="${esc(x.notes)}" data-chg="pnote" data-id="${x.id}"></div></div>`).join('')||emptyBox('No Community Partners','Registrations from the public form appear here.')}`)};

R['admin-interest']=r=>aShell(r,`<h1>Interest inbox</h1><p class="mute">Every sponsor or partner request arrives here. The creator must consent before anything is shared.</p>${S.interests.length?S.interests.map(x=>{const o=orgOf(x.org),i=idea(x.idea);const n=ISTAGES.indexOf(x.stage);const act={Sent:['Start review','admin_review'],'Admin review':['Ask creator for consent','ask'],'Creator agreed':['Schedule session','sched'],Scheduled:['Mark held','held'],Held:['Close','close']}[x.stage];return `<div class="card" style="margin-bottom:.8rem"><div class="row" style="justify-content:space-between"><div><b>${esc(o.name)}</b> ${pill(GROUPS[o.group],'t')} ${o.role?pill(o.role):''}<br><span class="small mute">${x.type==='pitch'?'Pitch request':'Interest'} · ${x.id} · idea ${x.idea} (${esc(i.removed?'removed':i.title)})</span></div>${pill(x.stage,x.declined?'r':'b')}</div><p class="small" style="margin:.5rem 0">"${esc(x.note)}" · Times: ${esc(x.times||'-')}</p><div class="small mute">${ISTAGES.map((s,k)=>k<=n?'<b>'+s+'</b>':s).join(' → ')}</div><div class="row" style="margin-top:.6rem">${act?`<button class="btn sm" data-act="istage" data-id="${x.id}:${act[1]}">${act[0]}</button>`:''}${['Sent','Admin review'].includes(x.stage)?`<button class="btn bad sm" data-act="istage" data-id="${x.id}:decline">Decline</button>`:''}${x.stage==='Creator consent requested'?'<span class="small mute">Waiting for the creator.</span>':''}${x.declined?'<span class="small">Creator declined: nothing was shared.</span>':''}</div></div>`}).join(''):emptyBox('No requests','Sponsor interest and pitch requests appear here.')}`);

/* ===== SPONSOR APP ===== */
const so=()=>S.orgs.find(o=>o.id===S.session.uid);
function cardsFor(o){return S.ideas.filter(i=>i.released&&!i.removed&&i.card.approved&&i.card.published&&['Good idea pool','Specialist pool','Top 3'].includes(i.outcome)).filter(i=>{
if(o.group==='g1')return S.settings.announced&&['Good idea pool','Top 3'].includes(i.outcome);
if(o.group==='g2')return i.outcome==='Top 3'?o.linked.includes(i.id):o.expertise.includes(i.sector);
return true})}
function sShell(r,body){const o=so();const open=S.interests.filter(x=>x.org===o.id&&!['Closed','Held'].includes(x.stage)).length;
const items=[['sponsor-home','Home'],['sponsor-cards','Idea cards'],['sponsor-shortlist','Shortlist'],['sponsor-requests','Requests',open||''],['sponsor-account','Account']];
const gate=!o.accepted&&r!=='sponsor-account'?`<h1>Confidentiality terms</h1><div class="card" style="max-width:40rem"><p>Before you see any idea card, please accept the confidentiality terms.</p><ul class="small mute"><li>Cards are confidential and for evaluation only.</li><li>You will not copy, share or use card content outside the Foundry process.</li><li>You will not contact creators directly. All contact goes through the Foundry, and only with the creator's consent.</li><li>A sponsor group never buys selection, a vote or any influence over who is chosen.</li></ul><button class="btn" data-act="accept">I accept the terms</button></div>`:body;
return appShell('Sponsor app',items,r,gate,[o.name,GROUPS[o.group]+(o.role?' · '+o.role:'')])}
ACTS.accept=()=>{so().accepted=true;log('Sponsor accepted confidentiality terms',so().name);save();render()};
R['sponsor-home']=r=>{const o=so(),c=cardsFor(o),op=S.interests.filter(x=>x.org===o.id);return sShell(r,`<h1>Welcome, ${esc(o.user.split(' ')[0])}</h1><p class="mute">${esc(o.name)} · ${GROUPS[o.group]}${o.role?' · '+o.role:''}</p><div class="grid g3"><div class="stat"><b>${c.length}</b><span>idea cards you can see</span></div><div class="stat"><b>${op.length}</b><span>your requests</span></div><div class="stat"><b>${S.shortlist.filter(x=>x.org===o.id).length}</b><span>on your shortlist</span></div></div><div class="card soft" style="margin-top:1rem"><h3>Batch 1</h3><p class="mute" style="margin:0">Pitch Night ${fd(S.content.pitch)} · Top 3 announced ${fd(S.content.announce)}</p></div>${o.group==='g1'&&!S.settings.announced?`<div class="note" style="margin-top:1rem">As a Programme Sponsor you see Good idea and Top 3 cards once finalists are announced on ${fd(S.content.announce)}. This protects independent selection.</div>`:''}<p style="margin-top:1rem"><a class="btn" href="#sponsor-cards">Browse idea cards</a></p>`)};
R['sponsor-cards']=r=>{const o=so(),f=S.ui.sf||{sec:'',cat:''};const l=cardsFor(o).filter(i=>(!f.sec||i.sector===f.sec)&&(!f.cat||i.outcome===f.cat));return sShell(r,`<h1>Idea cards</h1><div class="row" style="margin:1rem 0"><select data-chg="sfil" data-id="sec" aria-label="Sector" style="width:auto"><option value="">All sectors</option>${opts(SECTORS,f.sec)}</select><select data-chg="sfil" data-id="cat" aria-label="Category" style="width:auto"><option value="">All categories</option>${opts(['Good idea pool','Specialist pool','Top 3'],f.cat)}</select></div>${l.length?`<div class="grid g2">${l.map(i=>`<div class="card"><div class="row"><span class="pill ${oc[i.outcome]}">${i.outcome}</span>${pill(i.sector)}</div><h3 style="margin-top:.6rem">${esc(i.card.title)}</h3><p class="mute">${esc(i.card.summary)}</p><button class="btn sec sm" data-act="opencard" data-id="${i.id}">Open card</button></div>`).join('')}</div>`:emptyBox('No cards to show',o.group==='g1'&&!S.settings.announced?'Cards open after finalists are announced on '+fd(S.content.announce)+'.':'Cards appear here when creators have approved them and the Foundry has published them for your group.')}`)};
ACTS.sfil=(k,el)=>{S.ui.sf=Object.assign({sec:'',cat:''},S.ui.sf);S.ui.sf[k]=el.value;save();render()};
ACTS.opencard=id=>{S.ui.sc=id;S.audit.unshift({t:'2027-03-09 '+new Date().toTimeString().slice(0,5),who:so().name,act:'Viewed card',ref:id});save();go('sponsor-card')};
R['sponsor-card']=r=>{const o=so(),i=idea(S.ui.sc);if(!i||!cardsFor(o).includes(i))return sShell(r,`<h1>Card</h1>${emptyBox('Not available','This card is not available to your group.')}<p><a href="#sponsor-cards">Back to cards</a></p>`);
const sl=S.shortlist.find(x=>x.org===o.id&&x.idea===i.id),ex=S.interests.filter(x=>x.org===o.id&&x.idea===i.id);
const wm=encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='280' height='150'><text x='10' y='85' transform='rotate(-20 140 75)' font-family='Arial' font-size='15' fill='#17202E' fill-opacity='.07'>${o.name} · confidential</text></svg>`);
return sShell(r,`<p><a href="#sponsor-cards">← Idea cards</a></p><div class="card" style="background:#fff url(&quot;data:image/svg+xml,${wm}&quot;);max-width:44rem;user-select:none"><div class="row"><span class="pill ${oc[i.outcome]}">${i.outcome}</span>${pill(i.sector)}${pill(i.stage)}</div><h1 style="margin-top:.6rem">${esc(i.card.title)}</h1><p style="font-size:1.1rem">${esc(i.card.summary)}</p><h4>Evidence highlights</h4><ul>${i.card.highlights.filter(Boolean).map(h=>`<li>${esc(h)}</li>`).join('')}</ul>${i.outcome==='Top 3'?`<p class="small"><b>MVP progress:</b> ${esc(i.step)}. Shared with the creator's approval.</p>`:''}<p class="small mute">No creator name or contact. View only. Watermarks discourage copying but cannot prevent screenshots, so views are logged.</p></div>
<div class="row" style="margin:1rem 0"><button class="btn ghost" data-act="shortlist" data-id="${i.id}">${sl?'Remove from shortlist':'Save to shortlist'}</button></div>
${ex.length?`<div class="card soft" style="max-width:44rem"><b>Your requests on this card</b>${ex.map(x=>`<div class="sc"><span>${x.type==='pitch'?'Pitch request':'Interest'} · ${esc(x.note)}</span>${pill(x.stage,'b')}</div>`).join('')}</div>`:''}
<form class="card" data-form="interest" style="max-width:44rem;margin-top:1rem"><h3>Interest or pitch session</h3><div class="form">${field('type','What would you like to do?',`<select id="type" name="type"><option value="interest">I am interested</option><option value="pitch">Request a pitch session</option></select>`)}${o.group==='g3'?field('role','Your role',`<select id="role" name="role">${opts(['Investor','Customer','Distributor','Other'],o.role)}</select>`):''}${field('note','How could you help?',`<textarea id="note" name="note" required></textarea>`)}${field('times','Preferred times (for a session)',inp('times','text',''))}<p class="small mute">The creator must agree first, and the Foundry attends every session. Nothing is shared until then. No investment terms are sent from this app.</p><div><button class="btn">Send to the Foundry</button></div></div></form>`)};
ACTS.shortlist=id=>{const o=so();const k=S.shortlist.findIndex(x=>x.org===o.id&&x.idea===id);if(k>=0)S.shortlist.splice(k,1);else S.shortlist.push({org:o.id,idea:id,note:''});save();toast(k>=0?'Removed':'Saved to shortlist');render()};
FORMS.interest=(f,v)=>{const o=so(),i=idea(S.ui.sc);if(v.role)o.role=v.role;S.interests.unshift({id:nid('INT-',S.interests),org:o.id,idea:i.id,type:v.type,note:v.note,times:v.times,stage:'Sent',at:'2027-03-09'});log('Sponsor request sent',i.id);save();toast('Sent to the Foundry. The admin will review it.');render()};
R['sponsor-shortlist']=r=>{const o=so(),l=S.shortlist.filter(x=>x.org===o.id);return sShell(r,`<h1>Shortlist</h1>${l.length?l.map(x=>{const i=idea(x.idea);return `<div class="card" style="margin-bottom:.7rem"><div class="row" style="justify-content:space-between"><div><b>${esc(i.card.title)}</b><br><span class="small mute">${i.outcome} · ${esc(i.sector)}</span></div><div class="row"><button class="btn sec sm" data-act="opencard" data-id="${i.id}">Open</button><button class="btn ghost sm" data-act="shortlist" data-id="${i.id}">Remove</button></div></div><div class="field" style="margin-top:.5rem"><label class="small mute" for="sn${i.id}">Private note</label><input id="sn${i.id}" type="text" value="${esc(x.note)}" data-chg="snote" data-id="${i.id}"></div></div>`}).join(''):emptyBox('Nothing saved yet','Save cards from the card page.')}`)};
ACTS.snote=(id,el)=>{const x=S.shortlist.find(z=>z.org===so().id&&z.idea===id);if(x){x.note=el.value;save();toast('Saved')}};
R['sponsor-requests']=r=>{const o=so(),l=S.interests.filter(x=>x.org===o.id);return sShell(r,`<h1>Requests</h1>${l.length?l.map(x=>{const i=idea(x.idea),n=ISTAGES.indexOf(x.stage);return `<div class="card" style="margin-bottom:.7rem"><div class="row" style="justify-content:space-between"><div><b>${esc(i.card.title||x.idea)}</b><br><span class="small mute">${x.type==='pitch'?'Pitch request':'Interest'} · ${x.id}</span></div>${pill(x.stage,x.declined?'r':'b')}</div><p class="small" style="margin:.5rem 0">"${esc(x.note)}"</p><div class="small mute">${ISTAGES.map((s,k)=>k<=n?'<b>'+s+'</b>':s).join(' → ')}</div>${x.declined?'<p class="small">The creator did not agree to this session.</p>':''}${x.stage==='Scheduled'?`<p class="small">${esc(x.when||'')}</p>`:''}</div>`}).join(''):emptyBox('No requests yet','Open a card to show interest or request a pitch session.')}`)};
R['sponsor-report']=r=>R['sponsor-home'](r);
R['sponsor-account']=r=>{const o=so();return sShell(r,`<h1>Account</h1><dl class="kv"><dt>Organisation</dt><dd>${esc(o.name)}</dd><dt>Group</dt><dd>${GROUPS[o.group]}</dd>${o.role?`<dt>Role</dt><dd>${esc(o.role)}</dd>`:''}<dt>Main user</dt><dd>${esc(o.user)}</dd><dt>Terms</dt><dd>${o.accepted?pill('Confidentiality terms accepted','g'):pill('Not yet accepted','w')}</dd></dl><p class="small mute" style="margin-top:1rem">Team members are added by the Foundry admin only.</p><p><button class="btn ghost sm" data-act="signout">Sign out</button></p><h3 style="margin-top:1.5rem">Batch report</h3><div class="tw" style="max-width:30rem"><table class="tbl" style="min-width:0"><tbody><tr><td>Applications received</td><td><b>${S.ideas.length}</b></td></tr><tr><td>Outcomes released</td><td><b>${S.ideas.filter(i=>i.released).length}</b></td></tr><tr><td>Top 3 selected</td><td><b>${S.ideas.filter(i=>i.outcome==='Top 3').length}</b></td></tr><tr><td>Community members</td><td><b>${S.community.length}</b></td></tr></tbody></table></div><p class="small mute">No private idea details. Updated after each batch.</p>`)};

/* ===== BOOT ===== */
(function(){
if(!S.ui)S.ui={};
S.orgs.forEach(o=>{if(o.accepted===undefined)o.accepted=false});
render();
})();

</script>

</body></html>
